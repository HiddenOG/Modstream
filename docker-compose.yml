# Full stack: API, worker pool, Redis Streams, Postgres, Prometheus, Grafana.
#   docker compose up --build
#   docker compose up --scale worker=4      # more moderation throughput
# App: http://localhost:8000  API docs: /docs  Grafana: http://localhost:3000

x-app: &app
  build: .
  environment: &app-env
    MODSTREAM_ENV: prod
    MODSTREAM_SECRET_KEY: ${MODSTREAM_SECRET_KEY:-change-me-in-production}
    MODSTREAM_DATABASE_URL: postgresql+asyncpg://modstream:modstream@postgres:5432/modstream
    MODSTREAM_REDIS_URL: redis://redis:6379/0
    MODSTREAM_LOG_JSON: "true"
  depends_on:
    redis: { condition: service_healthy }
    postgres: { condition: service_healthy }
  restart: unless-stopped

services:
  api:
    <<: *app
    environment:
      <<: *app-env
      MODSTREAM_RUN_WORKER: "false"        # workers run in their own service
    ports: ["8000:8000"]
    volumes: [uploads:/app/instance/uploads]

  worker:
    <<: *app
    command: ["python", "-m", "modstream", "worker", "--concurrency", "1", "--metrics-port", "9100"]
    environment:
      <<: *app-env
      MODSTREAM_WARMUP: "true"
    deploy:
      replicas: 2

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modstream
      POSTGRES_PASSWORD: modstream
      POSTGRES_DB: modstream
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modstream"]
      interval: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: [./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/modstream.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  uploads:
  redis:
  postgres:
