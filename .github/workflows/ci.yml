name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint & unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  integration:
    name: Integration tests (Redis 7 + Postgres 16)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modstream
          POSTGRES_PASSWORD: modstream
          POSTGRES_DB: modstream
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U modstream" --health-interval 5s --health-retries 10
    env:
      MODSTREAM_TEST_REDIS_URL: redis://localhost:6379/0
      MODSTREAM_TEST_DATABASE_URL: postgresql+asyncpg://modstream:modstream@localhost:5432/modstream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -o addopts="" -v

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [test, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
