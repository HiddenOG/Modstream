name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint & unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  integration:
    name: Integration tests (Redis 7 + Postgres 16)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modstream
          POSTGRES_PASSWORD: modstream
          POSTGRES_DB: modstream
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U modstream" --health-interval 5s --health-retries 10
    env:
      MODSTREAM_TEST_REDIS_URL: redis://localhost:6379/0
      MODSTREAM_TEST_DATABASE_URL: postgresql+asyncpg://modstream:modstream@localhost:5432/modstream
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -o addopts="" -v

  docker:
    name: Docker image (${{ matrix.variant.name }})
    runs-on: ubuntu-latest
    needs: [test, integration]
    strategy:
      matrix:
        variant:
          - { name: "with model", with_model: "true", engine: "detoxify-unbiased" }
          - { name: "rules only", with_model: "false", engine: "lexicon-only" }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: modstream:ci
          build-args: WITH_MODEL=${{ matrix.variant.with_model }}
          cache-from: type=gha,scope=${{ matrix.variant.with_model }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.with_model }}
      - name: Start the container on a host-assigned port and check the engine
        run: |
          docker run -d --name app -e PORT=9000 -p 9000:9000 modstream:ci
          for i in $(seq 1 60); do curl -sf localhost:9000/api/v1/ready && break; sleep 2; done
          curl -sf localhost:9000/api/v1/health | tee health.json
          grep -q '"engine":"${{ matrix.variant.engine }}"' health.json
          curl -sf -X POST localhost:9000/api/v1/analyze -H 'Content-Type: application/json' \
            -d '{"text": "fuc your mom"}' | grep -q '"verdict":"flagged"'
      - name: Container logs on failure
        if: failure()
        run: docker logs app
